<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Animated illustration of ROBOWAY robots coordinating through a narrow passage">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0e2f28" stroke-width="1"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19e6c8" stop-opacity="0"/><stop offset=".5" stop-color="#39ff88"/><stop offset="1" stop-color="#19e6c8" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="960" height="600" rx="18" fill="#040807" stroke="#14594b" stroke-width="2"/>
<rect x="0" y="0" width="960" height="520" fill="url(#grid)"/>
<rect x="80" y="80" width="200" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="80" y="400" width="200" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="640" y="80" width="200" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="640" y="400" width="200" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="440" y="0" width="80" height="240" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="440" y="280" width="80" height="240" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="40" y="160" width="40" height="40" fill="#0f3a2c" stroke="#9dffc4" stroke-opacity=".8"/><text x="60" y="185" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" fill="#9dffc4" >P1</text><rect x="40" y="400" width="40" height="40" fill="#0f3a2c" stroke="#9dffc4" stroke-opacity=".8"/><text x="60" y="425" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" fill="#9dffc4" >P2</text><rect x="880" y="160" width="40" height="40" fill="#0b3340" stroke="#9ff7e6" stroke-opacity=".8"/><text x="900" y="185" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" fill="#9ff7e6" >D1</text><rect x="880" y="400" width="40" height="40" fill="#0b3340" stroke="#9ff7e6" stroke-opacity=".8"/><text x="900" y="425" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" fill="#9ff7e6" >D2</text>
<rect x="440" y="240" width="80" height="40" fill="#0b2a23" opacity=".7"/><text x="480" y="265" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="9" fill="#19e6c8" >1-CELL AISLE</text>
<g><rect x="320" y="360" width="40" height="40" fill="#3a0f14" stroke="#ff4d5e" stroke-width="1.5"/><path d="M328 368L352 392M352 368L328 392" stroke="#ff4d5e" stroke-width="2.5"/><animate attributeName="opacity" values=".3;1;1;.3" keyTimes="0;.3;.7;1" dur="3.5s" repeatCount="indefinite"/></g><text x="340" y="418" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="10" fill="#ff7b88" >BLOCKED</text>
<g><circle r="22" fill="none" stroke="#ffb84d" stroke-width="2"><animate attributeName="r" values="18;28;18" dur="1.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;.1;.9" dur="1.6s" repeatCount="indefinite"/></circle>
<animateMotion path="M540 220 V260 H60" dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.57;.86;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.55;.58;1" dur="14s" repeatCount="indefinite"/></g><g filter="url(#glow)"><circle r="13" fill="#39ff88"></circle><circle r="8" fill="#041210"/><text y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#e8fff7">R1</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.62;.7;1" dur="14s" repeatCount="indefinite"/><animateMotion path="M60 260 H900" dur="14s" repeatCount="indefinite" begin="0s" keyPoints="0;1;1" keyTimes="0;.57;1" calcMode="linear"/></g><g filter="url(#glow)"><circle r="13" fill="#ffb84d"><animate attributeName="fill" values="#ffb84d;#ffb84d;#19e6c8;#19e6c8" keyTimes="0;.56;.58;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle><circle r="8" fill="#041210"/><text y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#e8fff7">R2</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.92;.98;1" dur="14s" repeatCount="indefinite"/><animateMotion path="M540 220 V260 H60" dur="14s" repeatCount="indefinite" begin="0s" keyPoints="0;0;1;1" keyTimes="0;.57;.86;1" calcMode="linear"/></g><g filter="url(#glow)"><circle r="13" fill="#b6f26b"></circle><circle r="8" fill="#041210"/><text y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#e8fff7">R3</text><animateMotion path="M60 60 H300 V160 H60 Z" dur="10s" repeatCount="indefinite" begin="0s"/></g><g filter="url(#glow)"><circle r="13" fill="#19e6c8"></circle><circle r="8" fill="#041210"/><text y="4" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#e8fff7">R4</text><animateMotion path="M600 460 H840 V360 H600 Z" dur="12s" repeatCount="indefinite" begin="0s"/></g>
<rect x="0" y="520" width="960" height="80" fill="#050d0b"/><rect x="0" y="520" width="960" height="2" fill="url(#bar)"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></rect>
<text x="40" y="545" text-anchor="start" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" fill="#5fcab5" >EVENT LOG (illustrative animation)</text>
<text x="40" y="574" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#ffb84d" opacity="0">[WAIT] R2 waits at the corridor mouth: cell reserved by R1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.020;0.230;0.250;1" dur="14s" repeatCount="indefinite"/></text><text x="40" y="574" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#ff4dd2" opacity="0">[DEADLOCK_DETECTED] wait cycle R1 > R3 > R2 > R1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.270;0.480;0.500;1" dur="14s" repeatCount="indefinite"/></text><text x="40" y="574" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#39ff88" opacity="0">[DEADLOCK_RESOLVED] R3 yielded, all robots moving<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.520;0.730;0.750;1" dur="14s" repeatCount="indefinite"/></text><text x="40" y="574" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#19e6c8" opacity="0">[PACKAGE_STRANDED] J3 stranded, R3 assigned to recover it<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.770;0.980;1;1" dur="14s" repeatCount="indefinite"/></text>
<circle cx="926" cy="22" r="5" fill="#39ff88" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="912" y="26" text-anchor="end" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11" fill="#39ff88" >LIVE</text>
</svg>