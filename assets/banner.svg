<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="ROBOWAY banner: warehouse robot coordination arena">
<defs>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19e6c8"/><stop offset=".55" stop-color="#39ff88"/><stop offset="1" stop-color="#b6f26b"/></linearGradient>
  <radialGradient id="bgglow" cx="78%" cy="45%" r="55%"><stop offset="0" stop-color="#0f4a3f" stop-opacity=".55"/><stop offset="1" stop-color="#040807" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#040807" stop-opacity=".92"/><stop offset=".75" stop-color="#040807" stop-opacity=".7"/><stop offset="1" stop-color="#040807" stop-opacity="0"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19e6c8" stop-opacity="0"/><stop offset=".5" stop-color="#19e6c8" stop-opacity=".22"/><stop offset="1" stop-color="#19e6c8" stop-opacity="0"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19e6c8" stop-opacity="0"/><stop offset=".5" stop-color="#39ff88"/><stop offset="1" stop-color="#19e6c8" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0e2f28" stroke-width="1"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tglow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="380" fill="#040807"/>
<rect width="1280" height="380" fill="url(#bgglow)"/>
<rect width="1280" height="380" fill="url(#grid)"/>
<!-- warehouse -->
<rect x="760" y="80" width="160" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="960" y="80" width="160" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="760" y="240" width="160" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="960" y="240" width="160" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="1160" y="80" width="80" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/><rect x="1160" y="240" width="80" height="40" rx="5" fill="#0a211c" stroke="#14594b" stroke-width="1.5"/>
<rect x="780" y="300" width="40" height="40" fill="#0f3a2c" stroke="#39ff88" stroke-opacity=".7"/><text x="800" y="325" text-anchor="middle" font-family="monospace" font-size="12" fill="#9dffc4">P1</text>
<rect x="1100" y="300" width="40" height="40" fill="#0b3340" stroke="#19e6c8" stroke-opacity=".7"/><text x="1120" y="325" text-anchor="middle" font-family="monospace" font-size="12" fill="#9ff7e6">D1</text>
<g><rect x="1100" y="160" width="40" height="40" fill="#3a0f14" stroke="#ff4d5e" stroke-width="1.5"/><path d="M1108 168L1132 192M1132 168L1108 192" stroke="#ff4d5e" stroke-width="2.5"/><animate attributeName="opacity" values=".25;1;1;.25" keyTimes="0;.3;.7;1" dur="3.5s" repeatCount="indefinite"/></g>
<!-- robots -->
<g filter="url(#glow)">
    <circle r="18" fill="none" stroke="#39ff88" stroke-opacity=".35"><animate attributeName="r" values="16;21;16" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#39ff88"/><circle r="5" fill="#041210"/>
    <animateMotion path="M720 140 H1240" dur="9s" repeatCount="indefinite" begin="0s" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"/>
  </g>
<g filter="url(#glow)">
    <circle r="18" fill="none" stroke="#19e6c8" stroke-opacity=".35"><animate attributeName="r" values="16;21;16" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#19e6c8"/><circle r="5" fill="#041210"/>
    <animateMotion path="M1240 220 H720" dur="10s" repeatCount="indefinite" begin="-3s" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"/>
  </g>
<g filter="url(#glow)">
    <circle r="18" fill="none" stroke="#b6f26b" stroke-opacity=".35"><animate attributeName="r" values="16;21;16" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#b6f26b"/><circle r="5" fill="#041210"/>
    <animateMotion path="M940 40 V340" dur="8s" repeatCount="indefinite" begin="-1s" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"/>
  </g>
<g filter="url(#glow)">
    <circle r="18" fill="none" stroke="#ffb84d" stroke-opacity=".35"><animate attributeName="r" values="16;21;16" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#ffb84d"/><circle r="5" fill="#041210"/>
    <animateMotion path="M720 180 H1240" dur="12s" repeatCount="indefinite" begin="0s" keyPoints="0;.4;.4;1" keyTimes="0;.3;.6;1" calcMode="linear"/>
  </g>
<!-- text readability -->
<rect width="700" height="380" fill="url(#fadeL)"/>
<!-- scan -->
<rect y="0" width="160" height="380" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="-200 0;1400 0" dur="6.5s" repeatCount="indefinite"/></rect>
<!-- copy -->
<g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <text x="60" y="88" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="3.5" fill="#19e6c8">NEXHACK 2.0  ·  PROBLEM STATEMENT 5  ·  ROBOTICS</text>
  <text x="56" y="188" font-size="92" font-weight="800" letter-spacing="7" fill="url(#tg)" filter="url(#tglow)">ROBOWAY<animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/></text>
  <text x="60" y="232" font-size="28" font-weight="600" fill="#e8fff7">Warehouse Robot Coordination Arena</text>
  <text x="60" y="270" font-size="20" fill="#7fe9d4"><animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>Test your robot fleet before you buy one.</text>
</g>
<g><rect x="60" y="296" width="118" height="30" rx="15" fill="#06201b" stroke="#19e6c8" stroke-width="1.2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
<text x="119.0" y="316" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="1" fill="#9ff7e6">SPACE-TIME A*</text></g><g><rect x="190" y="296" width="146" height="30" rx="15" fill="#06201b" stroke="#19e6c8" stroke-width="1.2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
<text x="263.0" y="316" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="1" fill="#9ff7e6">DEADLOCK RECOVERY</text></g><g><rect x="348" y="296" width="132" height="30" rx="15" fill="#06201b" stroke="#19e6c8" stroke-width="1.2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
<text x="414.0" y="316" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="1" fill="#9ff7e6">LIVE 3D + PHONE</text></g>
<rect x="0" y="376" width="1280" height="4" fill="url(#edge)"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></rect>
</svg>