<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Pipeline: assign, plan, resolve, recover">
<defs><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="200" rx="18" fill="#040807"/>
<path d="M262 100 H336" stroke="#14594b" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M330 94 L340 100 L330 106" stroke="#19e6c8" stroke-width="2" fill="none"/><path d="M562 100 H636" stroke="#14594b" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M630 94 L640 100 L630 106" stroke="#19e6c8" stroke-width="2" fill="none"/><path d="M862 100 H936" stroke="#14594b" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M930 94 L940 100 L930 106" stroke="#19e6c8" stroke-width="2" fill="none"/>
<g><rect x="40" y="45" width="220" height="110" rx="14" fill="#06201b" stroke="#19e6c8" stroke-width="1.6" stroke-opacity=".35"><animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3" keyTimes="0;0.04;0.12;0.26;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="150" y="92" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#39ff88">1  ASSIGN</text>
<text x="150" y="124" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" fill="#a8f3e3">nearest free robot</text></g><g><rect x="340" y="45" width="220" height="110" rx="14" fill="#06201b" stroke="#19e6c8" stroke-width="1.6" stroke-opacity=".35"><animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3" keyTimes="0;0.29;0.37;0.51;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="450" y="92" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#39ff88">2  PLAN</text>
<text x="450" y="124" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" fill="#a8f3e3">Space-Time A* + reservations</text></g><g><rect x="640" y="45" width="220" height="110" rx="14" fill="#06201b" stroke="#19e6c8" stroke-width="1.6" stroke-opacity=".35"><animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3" keyTimes="0;0.54;0.62;0.76;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="750" y="92" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#39ff88">3  RESOLVE</text>
<text x="750" y="124" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" fill="#a8f3e3">no swaps, deadlock backoff</text></g><g><rect x="940" y="45" width="220" height="110" rx="14" fill="#06201b" stroke="#19e6c8" stroke-width="1.6" stroke-opacity=".35"><animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3" keyTimes="0;0.79;0.87;1.00;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="1050" y="92" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#39ff88">4  RECOVER</text>
<text x="1050" y="124" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" fill="#a8f3e3">reassign, one owner</text></g>
<circle r="7" fill="#b6f26b" filter="url(#g)"><animateMotion path="M40 100 H1160" dur="8s" repeatCount="indefinite"/></circle>
